name: Publicar painel

# A cada push na branch everson: testa, gera o build (dist/) e publica no Azure.
# Login no Azure por OIDC (sem senha guardada): a identidade só é aceita
# para esta branch deste repositório e só enxerga o grupo rg-coldtrack.
on:
  push:
    branches: [everson]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Testar e montar o site em dist/ (a publicação só acontece se passarem)
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # scripts/enviar-site.sh: assets/ com hash em cache longo, o resto em
      # no-cache, e remove do $web o que não está em dist/ (site antigo).
      # O mesmo script roda no publicar.sh (publicação pela máquina local).
      - name: Publicar no site estático
        run: |
          AZURE_STORAGE_ACCOUNT=stcoldtrackweb7319
          AZURE_STORAGE_KEY="$(az storage account keys list -n stcoldtrackweb7319 -g rg-coldtrack --query '[0].value' -o tsv)"
          echo "::add-mask::$AZURE_STORAGE_KEY"
          export AZURE_STORAGE_ACCOUNT AZURE_STORAGE_KEY
          bash scripts/enviar-site.sh dist
          echo "Publicado em https://stcoldtrackweb7319.z15.web.core.windows.net"

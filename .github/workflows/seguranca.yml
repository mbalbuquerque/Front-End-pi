name: Segurança

# Verificação das dependências do painel (npm audit, só as de produção).
# Roda sob demanda, toda segunda-feira e quando o lockfile muda na main.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [main]
    paths:
      - "package-lock.json"
      - ".github/workflows/seguranca.yml"

permissions:
  contents: read

jobs:
  dependencias:
    name: Dependências do painel (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Procurar vulnerabilidades conhecidas
        run: npm audit --omit=dev --audit-level=high

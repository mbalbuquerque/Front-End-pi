name: Testes

# Roda a cada push e pull request: lint, testes unitários e build.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Conferir páginas antigas no build (etiquetas QR)
        run: |
          for f in index dashboard login alertas relatorios veiculos sensores viagens configuracoes cadastro; do
            test -f "dist/$f.html" || { echo "falta dist/$f.html"; exit 1; }
          done

name: Testes

# Roda a cada push e pull request: lint, testes unitários, build e e2e (Playwright).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, testes, build e e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Conferir páginas antigas no build (etiquetas QR e links salvos)
        run: |
          for f in index dashboard login alertas relatorios veiculos sensores viagens configuracoes cadastro \
                   usuarios auditoria cadastro-usuario logistica monitoramento; do
            test -f "dist/$f.html" || { echo "falta dist/$f.html"; exit 1; }
          done

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # O playwright.config.js sobe o vite preview (dist/) sozinho; a API e os
      # serviços de terceiros são simulados em coldtrack-qa/tests/apoio.js.
      - name: Testes e2e
        run: npm run test:e2e

      - name: Relatório do Playwright (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
